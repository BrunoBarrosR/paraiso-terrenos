<title>Terrenos em Paraíso</title>
<style>
:root{color-scheme:light dark;--bg:#e2e8ee;--card:#f8f9fb;--fg:#1f2933;--muted:#5a6574;--line:#cdd5df;--accent:#2563a8;--bad:#c53030}
@media (prefers-color-scheme:dark){:root{--bg:#181d24;--card:#28313c;--fg:#e8ecf1;--muted:#a3adb9;--line:#404b59;--accent:#63a4e8;--bad:#f47272}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:14px}
h1{margin:0;font-size:1.25rem}
p{margin:0;color:var(--muted);font-size:.92rem}
.campo{display:flex;gap:8px}
#senha{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);flex:1;min-width:0}
#ver{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500;font-size:.9rem;padding:0 12px;white-space:nowrap}
#ver:hover{background:var(--bg)}
label.lembrar{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--muted)}
button{font:inherit;font-weight:600;padding:10px 12px;border:0;border-radius:8px;background:var(--accent);color:var(--bg);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#erro{color:var(--bad);min-height:1.4em;font-size:.9rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

  </div>

</form>

const CHAVE = "terrenos-senha";
const b64 = s => { const t = atob(s), u = new Uint8Array(t.length); for (let i = 0; i < t.length; i++) u[i] = t.charCodeAt(i); return u; };
async function abrir(senha) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  const chave = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(P.sal), iterations: P.iter, hash: "SHA-256"},
    base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const claro = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(P.iv)}, chave, b64(P.ct));   // erra se a senha estiver errada
  const html = await new Response(new Blob([claro]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open(); document.write(html); document.close();
}
const campo = document.getElementById("senha"), ver = document.getElementById("ver");
ver.addEventListener("click", () => {            // mostra o que foi digitado, para conferir
  const mostrar = campo.type === "password";
  campo.type = mostrar ? "text" : "password";
  ver.textContent = mostrar ? "Ocultar" : "Mostrar";
  ver.setAttribute("aria-pressed", mostrar);
  campo.focus();
});
const f = document.getElementById("f"), erro = document.getElementById("erro"), ok = document.getElementById("ok");
async function tentar(senha, lembrar) {
  ok.disabled = true; erro.textContent = "";
  try {
    await abrir(senha);
    try { lembrar ? localStorage.setItem(CHAVE, senha) : localStorage.removeItem(CHAVE); } catch (e) {}
  } catch (e) {
    ok.disabled = false;
    erro.textContent = e && e.name === "OperationError" ? "Senha incorreta." : "Não foi possível abrir (" + (e && e.message || e) + ").";
    try { localStorage.removeItem(CHAVE); } catch (x) {}
  }
}
f.addEventListener("submit", e => { e.preventDefault(); tentar(document.getElementById("senha").value, document.getElementById("lembrar").checked); });
try { const s = localStorage.getItem(CHAVE); if (s) { document.getElementById("lembrar").checked = true; tentar(s, true); } } catch (e) {}
</script>
